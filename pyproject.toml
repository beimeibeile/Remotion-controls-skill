[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remotion-controls-skill"
version = "1.0.0"
description = "Remotion 动画控制技能 - 透明背景动画渲染+模板库+关键帧构建"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["remotion", "animation", "transparent", "prores", "alpha-channel"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
